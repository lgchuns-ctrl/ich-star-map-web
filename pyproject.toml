[project]
name = "ich-star-map"
version = "0.1.0"
description = "非遗星图——国家级非物质文化遗产项目传承观察（数据管道）"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
